// Estado -> color
const colors = {
  'Lead (sin contactar)': '#2e7d32',   // verde Teya (mismo que usamos)
  'Activo': '#CFFF5C',                  // verde claro Teya
  'Closed Lost': '#e63946',             // rojo
  'Reached Out': '#f4a259'              // naranja
};

const labels = {
  'Lead (sin contactar)': 'Loyverse (sin contactar)',
  'Activo': 'Activo (TPV real)',
  'Closed Lost': 'Closed Lost',
  'Reached Out': 'Reached Out (Inside)'
};

const map = L.map('map').setView([39.35, -0.55], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

const layerGroups = {};
Object.keys(colors).forEach(k => layerGroups[k] = L.layerGroup().addTo(map));

const bounds = [];
markers.forEach(m => {
  const color = colors[m.estado] || '#6c757d';
  const marker = L.circleMarker([m.lat, m.lon], {
    radius: 6,
    fillColor: color,
    color: '#fff',
    weight: 1,
    fillOpacity: 0.9
  });

  const tpv = m.tpv ? (typeof m.tpv === 'number' ? new Intl.NumberFormat('es-ES', {maximumFractionDigits:0}).format(m.tpv) + ' EUR' : m.tpv) : 'N/D';
  const motivo = m.motivo ? '<div class="popup-sub">Motivo: ' + m.motivo + '</div>' : '';

  marker.bindPopup(
    '<div class="popup-title">' + m.name + '</div>' +
    '<div class="popup-sub">CP: ' + m.cp + ' &middot; Fuente: ' + m.source + '</div>' +
    motivo +
    '<div class="popup-sub">TPV: ' + tpv + '</div>' +
    '<div class="popup-tag" style="background:' + color + '22; color:' + color + '">' + (labels[m.estado] || m.estado) + '</div>'
  );

  marker.addTo(layerGroups[m.estado] || map);
  bounds.push([m.lat, m.lon]);
});

if (bounds.length) { map.fitBounds(bounds, { padding: [30,30] }); }

// Legend
const legendDiv = document.getElementById('legend');
let legendHtml = '<b>Estado</b><br/>';
Object.keys(colors).forEach(k => {
  legendHtml += '<div class="row"><span class="dot" style="background:' + colors[k] + '"></span>' + (labels[k] || k) + '</div>';
});
legendDiv.innerHTML = legendHtml;

// Filters (toggle layers)
const filtersDiv = document.getElementById('filters');
let filtersHtml = '<b>Mostrar</b><br/>';
Object.keys(colors).forEach(k => {
  const id = 'chk_' + k.replace(/[^a-zA-Z0-9]/g,'');
  filtersHtml += '<label><input type="checkbox" id="' + id + '" checked> <span class="dot" style="background:' + colors[k] + '"></span>' + (labels[k] || k) + '</label>';
});
filtersDiv.innerHTML = filtersHtml;

Object.keys(colors).forEach(k => {
  const id = 'chk_' + k.replace(/[^a-zA-Z0-9]/g,'');
  document.getElementById(id).addEventListener('change', (e) => {
    if (e.target.checked) {
      map.addLayer(layerGroups[k]);
    } else {
      map.removeLayer(layerGroups[k]);
    }
  });
});
